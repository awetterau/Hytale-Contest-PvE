quest.q_main_from_whence_they_come.category=main
quest.q_main_from_whence_they_come.title=From Whence They Come
quest.q_main_from_whence_they_come.summary=You managed to destroy several Blight Beast Nests, stopping their intrusion around the cathedral. Now, your holy forces have an opportunity to drive deeper into the Crimson Blight.
quest.q_main_from_whence_they_come.sourceType=npc
quest.q_main_from_whence_they_come.sourceId=darius
quest.q_main_from_whence_they_come.narrativeIntent=main questline
quest.q_main_from_whence_they_come.playerFantasy=progressing in the story, figure out some actual narrative
quest.q_main_from_whence_they_come.requirements.completedQuests=q_main_drive_them_back
