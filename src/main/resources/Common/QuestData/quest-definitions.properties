quest.retrieve_blacksmith_tools.category=npc
quest.retrieve_blacksmith_tools.title=Retrieve the Blacksmith's Hammer
quest.retrieve_blacksmith_tools.summary=The blacksmith cannot begin work without his missing hammer. Search the Blight, recover it, and make it back alive.
quest.retrieve_blacksmith_tools.sourceType=npc
quest.retrieve_blacksmith_tools.sourceId=blacksmith
quest.retrieve_blacksmith_tools.offerText=I can work bare-handed well enough to stay alive, but not well enough to raise a proper forge. My hammer was lost out in the Blight. Bring it back to me and I'll finally be able to set up a real workshop.
quest.retrieve_blacksmith_tools.inProgressText=Recover the blacksmith's hammer, extract alive with it, then return it to the blacksmith.
quest.retrieve_blacksmith_tools.completionText=That's my hammer. With this back in my hands, I can finally start building the workshop.
quest.retrieve_blacksmith_tools.hudMarkerText=Recover the blacksmith's hammer, extract alive, then return it
