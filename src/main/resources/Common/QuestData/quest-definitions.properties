quest.save_the_farm_animals.category=npc
quest.save_the_farm_animals.title=Save The Animals
quest.save_the_farm_animals.summary=The farmer's livestock scattered into the Blight. Find the missing animals one by one, escort them out alive, and bring them back to the haven.
quest.save_the_farm_animals.sourceType=npc
quest.save_the_farm_animals.sourceId=farmer
quest.save_the_farm_animals.offerText=The Blight spooked my animals and sent them running in every direction. A chicken bolted through the broken fencing, my calf wandered after the noise, and the little goat disappeared into the brush. If you find one out there, calm it down and lead it home alive.
quest.save_the_farm_animals.inProgressText=Only one missing animal will appear in the Blight at a time. Find it, make it follow you, and extract alive to bring it back to the haven.
quest.save_the_farm_animals.completionText=You brought them all back. The chicken is scratching again, the calf's settled down, and the goat's already looking for trouble. The farm finally feels alive.
quest.save_the_farm_animals.journalSummary=The farmer asked you to save the missing animals scattered through the Blight. Rescue each animal individually and extract alive to bring it back to the haven.
quest.save_the_farm_animals.hudMarkerText=Rescue the missing animal and extract alive
quest.save_the_farm_animals.completionCheckText=All missing animals rescued
quest.save_the_farm_animals.immediateRewardsText=Restores hope to the farm and proves the haven can protect its own
quest.save_the_farm_animals.targetPlayerLevel=beginner
quest.save_the_farm_animals.expectedDuration=3 rescue runs
quest.save_the_farm_animals.difficultyNotes=One active animal rescue target at a time with a moving world-map marker
quest.save_the_farm_animals.requiredLocations=Blight outskirts, ruined fences, abandoned pens
quest.save_the_farm_animals.requiredUi=NPC quest board, quest log, world-map animal marker
quest.save_the_farm_animals.rewards.setFlags=farmer_animals_rescued

