quest.q_main_drive_them_back.offerText=This sanctuary was built to hold back the Witch’s vile Crimson Blight, but its power is waning and our forces thinning. My men are occupied elsewhere, but I sense a special fire in you. Take up arms, warrior, and drive back the foul beasts that beset our holy claims! If you should return alive and unspoiled, the paladins will count you among our rank.
quest.q_main_drive_them_back.inProgressText=Return from 3 successful ventures into the Crimson Blight, killing 10 Blight Beasts in total.
quest.q_main_drive_them_back.completionText=Your blade is well-stained, warrior. I can smell the rot of Crimson upon it. You have done this sanctum a good service - you are now counted among the paladins.
quest.q_main_drive_them_back.journalSummary=You were sent to complete several ventures into the Crimson Blight to slay Blight Beasts and drive them back from the cathedral, earning the rank of paladin.
