quest.q_main_from_whence_they_come.repeatable=false
quest.q_main_from_whence_they_come.completionCheckText=Interaction performed (destroy the nest - 10s "cast" ability); Extraction successful
quest.q_main_from_whence_they_come.immediateRewardsText=Items / Currency / XP
quest.q_main_from_whence_they_come.offerText=You drove those cursed things back, for a time. We almost had a chance to gain a real footing, but our scouts have learned the beasts are steadily streaming from somewhere further in the Blight. I will ask that you, paladin, go and snuff out the vile nests from whence they come. I will mark what whereabouts the scouts were able to learn, but they were not able to observe for very long. [PARAGRAPH BREAK] Be mindful, paladin. We have not ventured deeper into the Blight on many occasions. There may be fouler beasts than those you have thus encountered.
quest.q_main_from_whence_they_come.inProgressText=Locate and destroy 3 Blight Beast Nests.
quest.q_main_from_whence_they_come.completionText=You have quelled the oncoming beasts once and for all, mighty paladin. We have now established a foothold around the cathedral, Demisian be praised! Perhaps we can begin to choke out this wretched plague at long last.
quest.q_main_from_whence_they_come.journalSummary=You managed to destroy several Blight Beast Nests, stopping their intrusion around the cathedral. Now, your holy forces have an opportunity to drive deeper into the Crimson Blight.
quest.q_main_from_whence_they_come.hudMarkerText=0/x Blight Beast Nest destroyed
quest.q_main_from_whence_they_come.difficultyNotes=added complexity from the first quest: now you must locate something specific in addition to killing a tougher variety of enemy
