# Farmer animal rescue configuration.
# Run-world placement is easiest through:
#   /setrescuespawn farmer_chicken
#   /setrescuespawn farmer_calf
#   /setrescuespawn farmer_goat
#
# The command writes to game-flow.properties and overrides any resource defaults.

animals=farmer_chicken,farmer_calf,farmer_goat

animal.farmer_chicken.displayName=Chicken
animal.farmer_chicken.objectiveRole=Farmer_Chicken_Objective
animal.farmer_chicken.hubRole=Farmer_Chicken_Base
animal.farmer_chicken.completionFlag=farmer_animal_chicken_rescued
animal.farmer_chicken.templateWorld=game
animal.farmer_chicken.markerId=farmer-animal-chicken
animal.farmer_chicken.markerName=Lost Chicken
animal.farmer_chicken.markerIcon=UserF.png
animal.farmer_chicken.markerColor=#ffe27a
animal.farmer_chicken.hubSpawn.x=600.0
animal.farmer_chicken.hubSpawn.y=179.0
animal.farmer_chicken.hubSpawn.z=27.0
animal.farmer_chicken.hubSpawn.pitch=0.0
animal.farmer_chicken.hubSpawn.yaw=90.0
animal.farmer_chicken.hubSpawn.roll=0.0

